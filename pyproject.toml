[project]
name = "agent-office"
version = "0.1.0"
description = "Multi-agent office automation system using CrewAI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=0.80.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0.0",
    "yfinance>=0.2.40",
    "streamlit>=1.40.0",
    "pandas>=2.0.0",
]

[project.scripts]
agent-office = "agent_office.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_office"]
