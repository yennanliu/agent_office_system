name: Stock Analysis

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      ticker:
        description: Stock ticker symbol
        default: AAPL
        required: false
        type: string
      recipient:
        description: Recipient email (leave blank to use repo variable STOCK_REPORT_RECIPIENT)
        required: false
        type: string

jobs:
  analyze:
    name: Analyze ${{ inputs.ticker || 'AAPL' }} and email summary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run stock analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          TICKER="${{ inputs.ticker || 'AAPL' }}"
          RECIPIENT="${{ inputs.recipient || vars.STOCK_REPORT_RECIPIENT }}"

          if [ -z "$RECIPIENT" ]; then
            echo "Error: recipient email not set. Configure the STOCK_REPORT_RECIPIENT repo variable or pass it via workflow_dispatch input."
            exit 1
          fi

          uv run agent-office stock --ticker "$TICKER" --to "$RECIPIENT"
